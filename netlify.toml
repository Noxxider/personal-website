# Static export: Netlify publishes the prerendered `out/` directory directly.
# No Next.js runtime, no serverless functions, no build plugin required.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# The old site linked a resume page. Everything else that used to exist is
# either preserved at the same path (/weighttracker, /tapbpm) or intentionally
# gone, and a 404 is the right answer for those so search engines drop them.
[[redirects]]
  from = "/resume"
  to = "/about/"
  status = 301
  force = true

# Long cache for content-hashed build output.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
