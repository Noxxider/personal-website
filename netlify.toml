# Static export: Netlify publishes the prerendered `out/` directory directly.
# No Next.js runtime, no serverless functions, no build plugin required.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Legacy Quasar SPA routes that no longer exist. Redirected rather than 404ed
# so anything already linked keeps landing somewhere sensible.
[[redirects]]
  from = "/resume"
  to = "/about/"
  status = 301
  force = true

[[redirects]]
  from = "/dentaltechnician"
  to = "/"
  status = 301
  force = true

# Long cache for content-hashed build output.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
